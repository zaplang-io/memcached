name: Test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  protocol:
    name: Offline protocol and connection tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    container: ghcr.io/zaplang-io/zap:latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
      - name: Check Zap formatting
        run: zap fmt --check src
      - name: Execute loopback protocol tests
        run: timeout -k 5s 60s zap test src/memcached.zap
  package:
    name: Package consumers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    container: ghcr.io/zaplang-io/zap:latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
      - name: Validate path and local registry installs
        run: sh tools/run-package-tests.sh
