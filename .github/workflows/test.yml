name: Test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  protocol:
    name: Offline protocol and connection tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    container: ghcr.io/zaplang-io/zap:latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Zap formatting
        run: zap fmt --check src tests
      - name: Execute loopback protocol tests
        run: timeout -k 5s 60s sh tools/run-tests.sh
  integration:
    name: Live memcached command tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    container: ghcr.io/zaplang-io/zap:latest
    services:
      memcached:
        image: memcached:1.6@sha256:a395a1bcf5e0e2b0fa4a0142e12b4e24a2320ba4b7c6ffa8655a1a86e8f29dee
        options: >-
          --health-cmd "bash -c ': </dev/tcp/127.0.0.1/11211'"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 30
    env:
      MEMCACHED_TEST_HOST: memcached
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Execute live command tests
        run: timeout -k 5s 60s sh tools/run-tests.sh
  package:
    name: Package consumers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    container: ghcr.io/zaplang-io/zap:latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate path and local registry installs
        run: sh tools/run-package-tests.sh
